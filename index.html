<script>
    // Agar Vercel par /api folder use kar rahe ho toh '' (khali) rakho, 
    // agar alag server (Render/Railway) hai toh yahan live URL dalo: e.g. 'https://your-backend.onrender.com'
    const BACKEND_URL = ''; 

    let currentGame = 'aviator';
    let currentUsername = localStorage.getItem('dbl_username') || '';
    let currentBalance = 0;
    let globalPlaneAnimId = null;

    window.onload = function() {
        if (localStorage.getItem('dbl_admin_token') === 'verified') {
            showAdminUI();
        } else if (currentUsername) {
            showAppUI();
        }
    };

    function switchAuthTab(type) {
        document.querySelectorAll('.auth-tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('form-login').style.display = 'none';
        document.getElementById('form-register').style.display = 'none';
        document.getElementById('auth-msg').innerText = '';

        if (type === 'login') {
            document.getElementById('at-login').classList.add('active');
            document.getElementById('form-login').style.display = 'block';
        } else if (type === 'register') {
            document.getElementById('at-register').classList.add('active');
            document.getElementById('form-register').style.display = 'block';
        }
    }

    async function doUniversalLogin() {
        const input = document.getElementById('login-input').value.trim();
        const password = document.getElementById('login-pass').value.trim();
        const msgEl = document.getElementById('auth-msg');
        msgEl.style.color = '#ef4444';

        if (!input || !password) {
            msgEl.innerText = 'Username and password required!';
            return;
        }

        // Hardcoded admin quick access check
        if ((input.toLowerCase() === 'admin123' || input.toLowerCase() === 'admin') && password === '12345') {
            localStorage.setItem('dbl_admin_token', 'verified');
            showAdminUI();
            return;
        }

        try {
            const res = await fetch(`${BACKEND_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ input, password })
            });
            const data = await res.json();
            if (data.success && data.user) {
                currentUsername = data.user.username;
                currentBalance = Number(data.user.balance || 0);
                localStorage.setItem('dbl_username', currentUsername);
                showAppUI();
            } else {
                msgEl.innerText = data.message || 'Invalid username or password';
            }
        } catch (err) {
            console.error('Real Login Error:', err);
            msgEl.innerText = 'Network error: Backend unreachable / API route missing';
        }
    }

    async function doUserRegister() {
        const body = {
            fullName: document.getElementById('reg-fullname').value.trim(),
            username: document.getElementById('reg-username').value.trim(),
            email: document.getElementById('reg-email').value.trim(),
            phone: document.getElementById('reg-phone').value.trim(),
            password: document.getElementById('reg-pass').value.trim()
        };
        const msgEl = document.getElementById('auth-msg');
        try {
            const res = await fetch(`${BACKEND_URL}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.success) {
                msgEl.style.color = '#22c55e';
                msgEl.innerText = 'Registered successfully! Switch to login.';
            } else {
                msgEl.style.color = '#ef4444';
                msgEl.innerText = data.message || 'Registration failed';
            }
        } catch (err) {
            msgEl.style.color = '#ef4444';
            msgEl.innerText = 'Network error connecting server';
        }
    }

    function showAppUI() {
        const authScreen = document.getElementById('screen-auth');
        if (authScreen) authScreen.classList.add('hidden');
        const header = document.getElementById('main-header');
        if (header) header.classList.add('visible');
        const nav = document.getElementById('main-nav');
        if (nav) nav.classList.add('visible');
        const tabGames = document.getElementById('tab-games');
        if (tabGames) tabGames.classList.add('active');
        const balanceEl = document.getElementById('header-balance');
        if (balanceEl) balanceEl.innerText = `Balance: $${currentBalance.toFixed(2)}`;
        startPlaneCanvasAnimation();
    }

    async function showAdminUI() {
        const authScreen = document.getElementById('screen-auth');
        if (authScreen) authScreen.classList.add('hidden');
        const adminScreen = document.getElementById('screen-admin');
        if (adminScreen) adminScreen.classList.add('active');
        await loadAdminTransactions();
    }

    async function loadAdminTransactions() {
        try {
            const resDp = await fetch(`${BACKEND_URL}/api/admin/deposits`);
            const dps = await resDp.json();
            const all = Array.isArray(dps) ? dps : [];
            const tbody = document.getElementById('admin-tx-table');
            if (!tbody) return;
            tbody.innerHTML = '';
            if (all.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No transactions found</td></tr>';
                return;
            }
            all.forEach(tx => {
                tbody.innerHTML += `
                    <tr>
                        <td>${tx.username || ''}</td>
                        <td>Deposit</td>
                        <td>${tx.method || ''}</td>
                        <td>$${tx.amount || 0}</td>
                        <td>${tx.status || 'Pending'}</td>
                        <td><button class="btn btn-green" style="padding:6px 10px; font-size:0.8rem;" onclick="approveTx('${tx._id}')">Approve</button></td>
                    </tr>
                `;
            });
        } catch (e) {
            console.error('Admin load error:', e);
        }
    }

    async function approveTx(reqId) {
        await fetch(`${BACKEND_URL}/api/admin/transaction/update`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reqId, status: 'Approved' })
        });
        loadAdminTransactions();
    }

    function handleLogout() {
        localStorage.removeItem('dbl_username');
        localStorage.removeItem('dbl_admin_token');
        location.reload();
    }

    function switchUserTab(tabId, btn) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        const targetTab = document.getElementById('tab-' + tabId);
        if (targetTab) targetTab.classList.add('active');
        if (btn) btn.classList.add('active');
    }

    function selectGame(type) {
        currentGame = type;
        const aviatorBox = document.getElementById('game-aviator-container');
        const miningBox = document.getElementById('game-mining-container');
        if (type === 'aviator') {
            if (aviatorBox) aviatorBox.style.display = 'block';
            if (miningBox) miningBox.style.display = 'none';
            startPlaneCanvasAnimation();
        } else {
            if (aviatorBox) aviatorBox.style.display = 'none';
            if (miningBox) miningBox.style.display = 'grid';
            stopPlaneCanvasAnimation();
        }
    }

    function startPlaneCanvasAnimation() {
        const canvas = document.getElementById('planeCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        if (globalPlaneAnimId) cancelAnimationFrame(globalPlaneAnimId);
        let frame = 0;
        function draw() {
            frame++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            let x = (frame * 2.5) % canvas.width;
            let y = canvas.height - Math.min(canvas.height - 20, Math.pow(x / 4, 1.8));
            ctx.quadraticCurveTo(x/2, canvas.height, x, y);
            ctx.stroke();

            ctx.fillStyle = '#facc15';
            ctx.font = '22px Arial';
            ctx.fillText('✈️', x - 10, y + 8);

            let currentVisualMult = (1 + (x / 200)).toFixed(2);
            const overlay = document.getElementById('aviator-multiplier-overlay');
            if (overlay) overlay.innerText = `${currentVisualMult}x`;

            globalPlaneAnimId = requestAnimationFrame(draw);
        }
        draw();
    }

    function stopPlaneCanvasAnimation() {
        if (globalPlaneAnimId) cancelAnimationFrame(globalPlaneAnimId);
    }

    async function submitGameBet() {
        const betAmountInput = document.getElementById('bet-amount');
        const targetChoiceInput = document.getElementById('aviator-target');
        if (!betAmountInput || !targetChoiceInput) return;
        const betAmount = betAmountInput.value;
        const targetChoice = targetChoiceInput.value;
        const msgEl = document.getElementById('game-result-msg');
        const playBtn = document.getElementById('play-btn');
        
        if (playBtn) playBtn.disabled = true;
        if (msgEl) {
            msgEl.style.color = '#cbd5e1';
            msgEl.innerText = 'Plane flying... Round in progress!';
        }

        try {
            const res = await fetch(`${BACKEND_URL}/api/game/play`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: currentUsername,
                    betAmount: Number(betAmount),
                    gameType: currentGame,
                    multiplierChoice: targetChoice
                })
            });
            const data = await res.json();
            setTimeout(() => {
                if (playBtn) playBtn.disabled = false;
                if (data.success) {
                    currentBalance = Number(data.balance);
                    if (msgEl) {
                        msgEl.style.color = data.isWin ? '#22c55e' : '#ef4444';
                        msgEl.innerText = `${data.message} | Multiplier: ${data.multiplier}x`;
                    }
                    const balEl = document.getElementById('header-balance');
                    if (balEl) balEl.innerText = `Balance: $${currentBalance.toFixed(2)}`;
                    const overlay = document.getElementById('aviator-multiplier-overlay');
                    if (overlay) overlay.innerText = data.isWin ? `${data.multiplier}x WIN!` : 'CRASHED!';
                } else if (msgEl) {
                    msgEl.style.color = '#ef4444';
                    msgEl.innerText = data.message || 'Game failed';
                }
            }, 1200);
        } catch (err) {
            if (playBtn) playBtn.disabled = false;
            if (msgEl) {
                msgEl.style.color = '#ef4444';
                msgEl.innerText = 'Network error playing game!';
            }
        }
    }

    function playGameMove(type, el) {
        if (type === 'mining' && el) {
            el.innerText = Math.random() > 0.4 ? '💎' : '💣';
            el.classList.add('revealed');
        }
    }

    async function handleDeposit() {
        const body = {
            username: currentUsername,
            method: document.getElementById('dp-method').value,
            sender: document.getElementById('dp-sender').value,
            amount: Number(document.getElementById('dp-amount').value),
            receiptInfo: document.getElementById('dp-ref').value
        };
        const msgEl = document.getElementById('wallet-msg');
        try {
            const res = await fetch(`${BACKEND_URL}/api/deposit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (msgEl) {
                msgEl.style.color = data.success ? '#22c55e' : '#ef4444';
                msgEl.innerText = data.message;
            }
        } catch (e) {
            if (msgEl) {
                msgEl.style.color = '#ef4444';
                msgEl.innerText = 'Deposit request failed.';
            }
        }
    }
</script>
