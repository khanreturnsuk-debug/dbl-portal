<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBL Gaming & Investment Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #1e293b; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .wallet-badge { background: #0f172a; padding: 8px 16px; border-radius: 20px; border: 1px solid #38bdf8; font-weight: bold; color: #38bdf8; }
        
        nav { display: flex; background: #1e293b; border-bottom: 1px solid #334155; }
        nav button { flex: 1; padding: 14px; background: none; border: none; color: #94a3b8; font-weight: bold; cursor: pointer; transition: 0.3s; }
        nav button.active { color: #38bdf8; border-bottom: 3px solid #38bdf8; background: rgba(56, 189, 248, 0.05); }

        .container { flex: 1; padding: 20px; max-width: 900px; margin: 0 auto; width: 100%; display: none; }
        .container.active { display: block; }

        /* Card / Game Box */
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #cbd5e1; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; }
        
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn:hover { background: #0ea5e9; }
        .btn-green { background: #22c55e; color: white; }
        .btn-green:hover { background: #16a34a; }

        /* Aviator Canvas / Mock */
        #aviator-display { height: 220px; background: #090d16; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; color: #facc15; margin-bottom: 15px; border: 1px solid #334155; }
        
        /* Mining Grid */
        .mining-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .tile { aspect-ratio: 1; background: #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .tile:hover { background: #475569; }
        .tile.revealed { background: #0f172a; cursor: default; }
    </style>
</head>
<body>

    <header>
        <h2>⚡ DBL 999 HUB</h2>
        <div class="wallet-badge" id="header-balance">Balance: $0.00</div>
    </header>

    <nav>
        <button class="tab-btn active" onclick="switchTab('games', this)">🎮 Games (Aviator/Mining)</button>
        <button class="tab-btn" onclick="switchTab('wallet', this)">wallet Pakistani Payments</button>
    </nav>

    <!-- GAMES SECTION -->
    <div id="tab-games" class="container active">
        <div class="card">
            <h3 style="margin-bottom: 15px;">Select Game</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="btn" style="flex:1;" onclick="selectGame('aviator')">✈️ Aviator Crash</button>
                <button class="btn" style="flex:1; background:#64748b;" onclick="selectGame('mining')">⛏️ Mining Grid</button>
            </div>

            <!-- Aviator UI -->
            <div id="game-aviator-container">
                <div id="aviator-display">1.00x</div>
                <div class="form-group">
                    <label>Target Multiplier (Cashout)</label>
                    <input type="number" id="aviator-target" value="2.0" step="0.1" min="1.1">
                </div>
            </div>

            <!-- Mining UI -->
            <div id="game-mining-container" style="display:none;">
                <div class="mining-grid" id="grid">
                    <!-- 4x4 Grid tiles -->
                    <div class="tile" onclick="playGameMove('mining', this)">❓</div>
                    <div class="tile" onclick="playGameMove('mining', this)">❓</div>
                    <div class="tile" onclick="playGameMove('mining', this)">❓</div>
                    <div class="tile" onclick="playGameMove('mining', this)">❓</div>
                    <div class="tile" onclick="playGameMove('mining', this)">❓</div>
                    <div class="tile" onclick="playGameMove('mining', this)">❓</div>
                    <div class="tile" onclick="playGameMove('mining', this)">❓</div>
                    <div class="tile" onclick="playGameMove('mining', this)">❓</div>
                </div>
            </div>

            <div class="form-group">
                <label>Bet Amount ($)</label>
                <input type="number" id="bet-amount" value="10" min="1">
            </div>
            <button class="btn btn-green" onclick="submitGameBet()">Place Bet & Play</button>
            <p id="game-result-msg" style="margin-top: 15px; text-align: center; font-weight: bold;"></p>
        </div>
    </div>

    <!-- WALLET / PAKISTANI LOCAL PAYMENTS SECTION -->
    <div id="tab-wallet" class="container">
        <div class="card">
            <h3>PK / Crypto Deposit</h3>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="dp-username" placeholder="anas_admin">
            </div>
            <div class="form-group">
                <label>Payment Method</label>
                <select id="dp-method">
                    <option value="Easypaisa">Easypaisa (Pakistan)</option>
                    <option value="JazzCash">JazzCash (Pakistan)</option>
                    <option value="Bank Transfer">Bank Transfer (Pakistan)</option>
                    <option value="USDT TRC20">USDT TRC20 (Crypto)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Sender Account / Number</label>
                <input type="text" id="dp-sender" placeholder="03001234567">
            </div>
            <div class="form-group">
                <label>Amount ($ or PKR equivalent value)</label>
                <input type="number" id="dp-amount" placeholder="10">
            </div>
            <div class="form-group">
                <label>TID / Transaction Hash / Receipt Info</label>
                <input type="text" id="dp-ref" placeholder="TID123456789">
            </div>
            <button class="btn btn-green" onclick="handleDeposit()">Submit Deposit</button>
        </div>

        <div class="card">
            <h3>Withdrawal Request</h3>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="wd-username" placeholder="anas_admin">
            </div>
            <div class="form-group">
                <label>Method</label>
                <select id="wd-method">
                    <option value="Easypaisa">Easypaisa</option>
                    <option value="JazzCash">JazzCash</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Account Number / IBAN</label>
                <input type="text" id="wd-acc-num">
            </div>
            <div class="form-group">
                <label>Account Title / Name</label>
                <input type="text" id="wd-acc-name">
            </div>
            <div class="form-group">
                <label>Amount ($)</label>
                <input type="number" id="wd-amount" min="50">
            </div>
            <button class="btn" onclick="handleWithdraw()">Request Withdrawal (17% Tax)</button>
        </div>
        <p id="wallet-msg" style="text-align: center; font-weight: bold;"></p>
    </div>

    <script>
        let currentGame = 'aviator';
        let currentUsername = localStorage.getItem('dbl_username') || 'anas_admin';

        function switchTab(tabId, btn) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
        }

        function selectGame(type) {
            currentGame = type;
            if (type === 'aviator') {
                document.getElementById('game-aviator-container').style.display = 'block';
                document.getElementById('game-mining-container').style.display = 'none';
            } else {
                document.getElementById('game-aviator-container').style.display = 'none';
                document.getElementById('game-mining-container').style.display = 'grid';
            }
        }

        async function submitGameBet() {
            const betAmount = document.getElementById('bet-amount').value;
            const targetChoice = document.getElementById('aviator-target').value;
            const msgEl = document.getElementById('game-result-msg');
            msgEl.style.color = '#cbd5e1';
            msgEl.innerText = 'Processing round...';

            try {
                const res = await fetch('/api/game/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUsername,
                        betAmount: Number(betAmount),
                        gameType: currentGame,
                        multiplierChoice: targetChoice
                    })
                });
                const data = await res.json();
                if (data.success) {
                    msgEl.style.color = data.isWin ? '#22c55e' : '#ef4444';
                    msgEl.innerText = `${data.message} | Multiplier: ${data.multiplier}x`;
                    document.getElementById('header-balance').innerText = `Balance: $${Number(data.balance).toFixed(2)}`;
                } else {
                    msgEl.style.color = '#ef4444';
                    msgEl.innerText = data.message;
                }
            } catch (err) {
                msgEl.style.color = '#ef4444';
                msgEl.innerText = 'Network error playing game!';
            }
        }

        function playGameMove(type, el) {
            if (type === 'mining') {
                el.innerText = Math.random() > 0.4 ? '💎' : '💣';
                el.classList.add('revealed');
            }
        }

        async function handleDeposit() {
            const body = {
                username: document.getElementById('dp-username').value || currentUsername,
                method: document.getElementById('dp-method').value,
                sender: document.getElementById('dp-sender').value,
                amount: Number(document.getElementById('dp-amount').value),
                receiptInfo: document.getElementById('dp-ref').value
            };
            const msgEl = document.getElementById('wallet-msg');
            try {
                const res = await fetch('/api/deposit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                msgEl.style.color = data.success ? '#22c55e' : '#ef4444';
                msgEl.innerText = data.message;
            } catch (e) {
                msgEl.style.color = '#ef4444';
                msgEl.innerText = 'Deposit request failed.';
            }
        }

        async function handleWithdraw() {
            const body = {
                username: document.getElementById('wd-username').value || currentUsername,
                method: document.getElementById('wd-method').value,
                accountNumber: document.getElementById('wd-acc-num').value,
                accountName: document.getElementById('wd-acc-name').value,
                amount: Number(document.getElementById('wd-amount').value)
            };
            const msgEl = document.getElementById('wallet-msg');
            try {
                const res = await fetch('/api/withdraw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                msgEl.style.color = data.success ? '#22c55e' : '#ef4444';
                msgEl.innerText = data.message;
            } catch (e) {
                msgEl.style.color = '#ef4444';
                msgEl.innerText = 'Withdrawal request failed.';
            }
        }
    </script>
</body>
</html>
