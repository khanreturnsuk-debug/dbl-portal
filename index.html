<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBL Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f131a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background-color: #131722;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        /* Top Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #131722;
        }
        .menu-icon, .notification-icon {
            font-size: 20px;
            cursor: pointer;
            color: #ffffff;
        }
        .logo-container h1 {
            color: #22c55e;
            font-size: 18px;
        }
        .logo-container p {
            color: #9ca3af;
            font-size: 10px;
            text-align: center;
        }
        /* Main Content */
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .section-title {
            color: #22c55e;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .profile-card {
            background-color: #1e222d;
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid #22c55e;
            margin-bottom: 20px;
        }
        .profile-card p {
            margin: 8px 0;
            color: #d1d5db;
            font-size: 14px;
        }
        /* Referral Section */
        .referral-box {
            background-color: #1e222d;
            border: 1px solid #22c55e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .referral-box h3 {
            font-size: 15px;
            margin-bottom: 10px;
        }
        .referral-row {
            display: flex;
            gap: 10px;
        }
        .referral-input {
            flex: 1;
            background-color: #0f131a;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 10px;
            color: #9ca3af;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .copy-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .logout-btn {
            width: 100%;
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Sidebar Menu */
        .sidebar {
            position: absolute;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background-color: #181c27;
            transition: 0.3s ease;
            z-index: 100;
            padding-top: 20px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }
        .sidebar.active {
            left: 0;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #2a303c;
        }
        .sidebar-header h2 {
            color: #22c55e;
            font-size: 20px;
        }
        .sidebar-header p {
            color: #9ca3af;
            font-size: 12px;
        }
        .sidebar-menu {
            list-style: none;
            padding: 20px 0;
        }
        .sidebar-menu li a {
            display: block;
            padding: 12px 20px;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .sidebar-menu li a:hover {
            background-color: #22c55e22;
            color: #22c55e;
        }
        /* Bottom Navigation Tabs */
        .bottom-nav {
            display: flex;
            background-color: #131722;
            border-top: 1px solid #1f2937;
            padding: 10px 0;
        }
        .nav-item {
            flex: 1;
            text-align: center;
            color: #9ca3af;
            text-decoration: none;
            font-size: 11px;
        }
        .nav-item.active {
            color: #22c55e;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Navbar -->
        <div class="navbar">
            <div class="menu-icon" onclick="toggleSidebar()">☰</div>
            <div class="logo-container">
                <h1>DBL Portal</h1>
                <p>Dollar Burst Limited</p>
            </div>
            <div class="notification-icon">🔔</div>
        </div>

        <!-- Sidebar / Side Menu -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>DBL Portal</h2>
                <p>anas_admin</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" onclick="toggleSidebar()">🏠 Dashboard</a></li>
                <li><a href="#" onclick="toggleSidebar()">💰 Deposit</a></li>
                <li><a href="#" onclick="toggleSidebar()">💸 Withdraw</a></li>
                <li><a href="#" onclick="toggleSidebar()">👥 Team</a></li>
            </ul>
        </div>

        <!-- Main Profile Content -->
        <div class="content">
            <h2 class="section-title">Account Profile</h2>
            
            <div class="profile-card">
                <p><strong>Name:</strong> Anas Khan</p>
                <p><strong>Username:</strong> anas_admin</p>
                <p><strong>Current VIP:</strong> VIP 1</p>
            </div>

            <!-- Referral Link Box -->
            <div class="referral-box">
                <h3>Invite Friends & Earn</h3>
                <div class="referral-row">
                    <div class="referral-input" id="refLink">https://dblportal.com/ref?user=anas_admin</div>
                    <button class="copy-btn" onclick="copyReferralLink()">Copy</button>
                </div>
            </div>

            <button class="logout-btn">Logout Account</button>
        </div>

        <!-- Bottom Tabs -->
        <div class="bottom-nav">
            <a href="#" class="nav-item">Home</a>
            <a href="#" class="nav-item">Investments</a>
            <a href="#" class="nav-item active">DBL</a>
            <a href="#" class="nav-item">Wallet</a>
            <a href="#" class="nav-item active">Profile</a>
        </div>
    </div>

    <script>
        // Sidebar Open/Close Function
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("active");
        }

        // Copy Referral Link Function
        function copyReferralLink() {
            const linkText = "https://dblportal.com/ref?user=anas_admin";
            navigator.clipboard.writeText(linkText).then(() => {
                alert("Referral link copied successfully!");
            });
        }
    </script>
</body>
</html>
