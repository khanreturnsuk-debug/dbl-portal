<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal - Login & Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .hidden {
            display: none !important;
        }
        h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #38bdf8;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
        }
        input:focus {
            border-color: #38bdf8;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        .error-msg {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }
        .switch-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
        .switch-text span {
            color: #38bdf8;
            cursor: pointer;
            text-decoration: underline;
        }
        .dashboard-card {
            background: #0f172a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGIN VIEW -->
        <div id="view-login">
            <h2>User Login</h2>
            <div id="login-error" class="error-msg hidden"></div>
            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" id="login-username" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter password">
            </div>
            <button onclick="handleLogin()">Login</button>
            <div class="switch-text">Don't have an account? <span onclick="switchView('register')">Register</span></div>
        </div>

        <!-- REGISTER VIEW -->
        <div id="view-register" class="hidden">
            <h2>Create Account</h2>
            <div id="reg-error" class="error-msg hidden"></div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-username" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Choose a password">
            </div>
            <button id="reg-submit-btn" onclick="handleRegister()">Register</button>
            <div class="switch-text">Already have an account? <span onclick="switchView('login')">Login</span></div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="view-dashboard" class="hidden">
            <h2>Dashboard</h2>
            <div class="dashboard-card">
                <p><strong>Welcome, </strong><span id="dash-name">User</span></p>
                <p><strong>Balance: </strong>$<span id="dash-balance">0.00</span></p>
            </div>
            <button id="menu-toggle-btn" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <script>
        let currentUser = null;

        function showError(elementId, message) {
            const errBox = document.getElementById(elementId);
            errBox.innerText = message;
            errBox.classList.remove('hidden');
        }

        function clearError(elementId) {
            const errBox = document.getElementById(elementId);
            errBox.innerText = '';
            errBox.classList.add('hidden');
        }

        function switchView(viewName) {
            clearError('login-error');
            clearError('reg-error');
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-register').classList.add('hidden');
            document.getElementById('view-dashboard').classList.add('hidden');

            if (viewName === 'login') {
                document.getElementById('view-login').classList.remove('hidden');
            } else if (viewName === 'register') {
                document.getElementById('view-register').classList.remove('hidden');
            } else if (viewName === 'dashboard') {
                document.getElementById('view-dashboard').classList.remove('hidden');
            }
        }

        function getAccounts() {
            try {
                return JSON.parse(localStorage.getItem('users') || '{}');
            } catch (e) {
                return {};
            }
        }

        // Registration with Loading State & Success Notification
        async function handleRegister() {
            clearError('reg-error');
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;

            if (!username || !password) {
                showError('reg-error', '⚠️ Please fill in all fields.');
                return;
            }

            const submitBtn = document.getElementById('reg-submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Creating Account...";

            // Simulating network/processing delay for loading effect
            await new Promise(resolve => setTimeout(resolve, 800));

            try {
                let users = getAccounts();
                const lowerUsername = username.toLowerCase();

                // Check if user already exists
                const existingKey = Object.keys(users).find(k => k.trim().toLowerCase() === lowerUsername);
                if (existingKey) {
                    showError('reg-error', '❌ Username already taken!');
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Register";
                    return;
                }

                // Save new user
                users[username] = {
                    username: username,
                    fullName: username,
                    password: password,
                    balance: 0.00,
                    taskDone: false
                };

                localStorage.setItem('users', JSON.stringify(users));

                alert('Account created successfully!');
                document.getElementById('reg-username').value = '';
                document.getElementById('reg-password').value = '';
                switchView('login');

            } catch (err) {
                showError('reg-error', '❌ Registration failed. Try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Register";
            }
        }

        // Advanced Login Logic with "User not found" check
        function handleLogin() {
            clearError('login-error');
            const input = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value;

            if (!input || !pass) {
                showError('login-error', '⚠️ Please enter both Username and Password.');
                return;
            }

            if (input.toLowerCase() === "admin1" || input.toLowerCase() === "anas khan") {
                if ((input.toLowerCase() === "admin1" && pass !== "12345") || 
                    (input.toLowerCase() === "anas khan" && pass !== "anas")) {
                    showError('login-error', '❌ Invalid Password! Please enter correct credentials.');
                    return;
                }
                currentUser = {
                    fullName: "Anas Khan",
                    balance: 55001.00,
                    taskDone: false
                };
            } else {
                const users = getAccounts();
                const lowerInput = input.toLowerCase();
                
                let matchedKey = Object.keys(users).find(k => k && k.trim().toLowerCase() === lowerInput);
                let matchedUser = matchedKey ? users[matchedKey] : null;

                // Fallback check in localstorage items directly
                if (!matchedUser) {
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        try {
                            const val = JSON.parse(localStorage.getItem(key));
                            if (val && typeof val === 'object' && val.password) {
                                if (key.trim().toLowerCase() === lowerInput || 
                                    (val.username && val.username.trim().toLowerCase() === lowerInput)) {
                                    matchedUser = val;
                                    break;
                                }
                            }
                        } catch(e) {}
                    }
                }

                // Proper User Not Found Error
                if (!matchedUser) {
                    showError('login-error', '❌ User not found! Please register first.');
                    return;
                }

                if (matchedUser.password !== pass) {
                    showError('login-error', '❌ Incorrect password!');
                    return;
                }
                currentUser = matchedUser;
            }

            updateUI();
            switchView('dashboard');
        }

        function updateUI() {
            if (currentUser) {
                document.getElementById('dash-name').innerText = currentUser.fullName || currentUser.username || "User";
                document.getElementById('dash-balance').innerText = Number(currentUser.balance || 0).toFixed(2);
            }
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            switchView('login');
        }
    </script>
</body>
</html>
